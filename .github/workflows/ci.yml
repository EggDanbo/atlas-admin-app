name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次未完成的流水线
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build (H5)
        run: pnpm run build:h5
        env:
          TARO_APP_H5_BASENAME: atlas-admin-app
          TARO_APP_USE_MOCK: 'true'
          TARO_APP_PASSWORD_LOGIN: 'true'

      - name: Build (Weapp)
        run: pnpm run build:weapp
